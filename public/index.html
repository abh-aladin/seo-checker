<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEO 자동 검수 · 알라딘 개발센터</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --black: #111111;
  --gray-dark: #444444;
  --gray-mid: #888888;
  --gray-light: #cccccc;
  --gray-line: #e8e8e8;
  --gray-bg: #f5f5f5;
  --white: #ffffff;
  --pass: #1a6b3c;
  --warn: #92400e;
  --fail: #991b1b;
  --font: 'Pretendard', -apple-system, 'Apple SD Gothic Neo', sans-serif;
}

body {
  background: var(--white);
  color: var(--black);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.7;
  min-height: 100vh;
}

.page {
  max-width: 720px;
  margin: 0 auto;
  padding: 64px 24px 120px;
}

header {
  border-bottom: 2px solid var(--black);
  padding-bottom: 24px;
  margin-bottom: 48px;
}

.brand {
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--gray-mid);
  margin-bottom: 12px;
  font-weight: 500;
}

h1 {
  font-size: 32px;
  font-weight: 800;
  letter-spacing: -0.03em;
  line-height: 1.2;
  margin-bottom: 8px;
}

.desc {
  font-size: 14px;
  color: var(--gray-dark);
  font-weight: 400;
}

.input-wrap { margin-bottom: 48px; }

.field-label {
  font-size: 13px;
  font-weight: 600;
  color: var(--black);
  display: block;
  margin-bottom: 10px;
}

.input-row {
  display: flex;
  border: 1.5px solid var(--black);
}

input[type="url"] {
  flex: 1;
  border: none;
  padding: 14px 16px;
  font-size: 14px;
  font-family: var(--font);
  font-weight: 600;
  color: var(--black);
  background: var(--white);
  outline: none;
}

input[type="url"]::placeholder {
  color: var(--gray-light);
  font-weight: 400;
}

button.primary {
  background: var(--black);
  color: var(--white);
  border: none;
  padding: 14px 24px;
  font-size: 14px;
  font-family: var(--font);
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  transition: opacity 0.15s;
}

button.primary:hover { opacity: 0.75; }
button.primary:disabled { opacity: 0.3; cursor: not-allowed; }

.input-note {
  font-size: 13px;
  color: var(--gray-dark);
  margin-top: 10px;
  line-height: 1.5;
  font-weight: 400;
}

.loading {
  display: none;
  padding: 48px 0;
  border-top: 1px solid var(--gray-line);
}

.loading-inner {
  display: flex;
  align-items: center;
  gap: 14px;
}

.spinner {
  width: 20px;
  height: 20px;
  border: 2px solid var(--gray-line);
  border-top-color: var(--black);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  flex-shrink: 0;
}

@keyframes spin { to { transform: rotate(360deg); } }

.loading-msg {
  font-size: 14px;
  color: var(--gray-dark);
  font-weight: 400;
}

.report { display: none; }

.report-summary {
  border-top: 2px solid var(--black);
  border-bottom: 1px solid var(--gray-line);
  padding: 32px 0;
}

.report-url {
  font-size: 12px;
  color: var(--gray-mid);
  margin-bottom: 20px;
  word-break: break-all;
  font-weight: 400;
}

.score-block {
  display: flex;
  align-items: baseline;
  gap: 6px;
  margin-bottom: 16px;
}

.score-num {
  font-size: 64px;
  font-weight: 800;
  letter-spacing: -0.04em;
  line-height: 1;
}

.score-denom {
  font-size: 18px;
  color: var(--gray-mid);
  font-weight: 400;
}

.score-pass { color: var(--black); }
.score-mid { color: var(--black); }
.score-bad { color: var(--fail); }

.stat-row {
  display: flex;
  gap: 24px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.stat-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
}

.stat-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}

.dot-pass { background: var(--pass); }
.dot-warn { background: var(--warn); }
.dot-fail { background: var(--fail); }
.dot-skip { background: var(--gray-light); }

.stat-label { color: var(--gray-dark); font-weight: 400; }
.stat-num { font-weight: 700; }

.ext-links {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.ext-a {
  font-size: 12px;
  font-family: var(--font);
  font-weight: 500;
  color: var(--gray-dark);
  text-decoration: none;
  border: 1px solid var(--gray-line);
  padding: 5px 12px;
  transition: border-color 0.15s, color 0.15s;
}

.ext-a:hover {
  border-color: var(--black);
  color: var(--black);
}

.sections { border-bottom: 1px solid var(--gray-line); }

.section { border-top: 1px solid var(--gray-line); }

.sec-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 0;
  cursor: pointer;
  user-select: none;
}

.sec-head:hover .sec-title { opacity: 0.6; }

.sec-left {
  display: flex;
  align-items: center;
  gap: 12px;
}

.sec-title {
  font-size: 14px;
  font-weight: 700;
  letter-spacing: -0.01em;
  transition: opacity 0.15s;
}

.sec-badge {
  font-size: 11px;
  font-weight: 700;
  padding: 2px 8px;
}

.badge-pass { color: var(--pass); background: #f0faf4; }
.badge-warn { color: var(--warn); background: #fef9ec; }
.badge-fail { color: var(--fail); background: #fef2f2; }

.sec-arrow {
  font-size: 12px;
  color: var(--gray-mid);
  transition: transform 0.2s;
}

.section.collapsed .sec-arrow { transform: rotate(-90deg); }
.section.collapsed .sec-body { display: none; }

.sec-body { padding-bottom: 8px; }

.check-row {
  display: grid;
  grid-template-columns: 20px 1fr 60px;
  gap: 12px;
  align-items: start;
  padding: 12px 0;
  border-top: 1px solid var(--gray-bg);
}

.c-icon {
  font-size: 12px;
  padding-top: 2px;
  font-weight: 700;
}

.icon-pass { color: var(--pass); }
.icon-warn { color: var(--warn); }
.icon-fail { color: var(--fail); }
.icon-skip { color: var(--gray-light); }

.c-name {
  font-size: 13px;
  font-weight: 600;
  color: var(--black);
  margin-bottom: 3px;
}

.c-detail {
  font-size: 12px;
  font-weight: 400;
  line-height: 1.5;
  word-break: break-all;
  color: var(--gray-dark);
}

.c-detail.fail { color: var(--fail); }
.c-detail.warn { color: var(--warn); }
.c-detail.pass { color: var(--pass); }

.c-status {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-align: right;
  padding-top: 2px;
}

.s-pass { color: var(--pass); }
.s-warn { color: var(--warn); }
.s-fail { color: var(--fail); }
.s-skip { color: var(--gray-light); }

.err-box {
  border: 1.5px solid var(--fail);
  padding: 16px 18px;
  font-size: 13px;
  font-weight: 500;
  color: var(--fail);
  margin: 16px 0;
}

button.ghost {
  background: transparent;
  color: var(--gray-dark);
  border: 1px solid var(--gray-line);
  padding: 10px 18px;
  font-size: 13px;
  font-family: var(--font);
  font-weight: 500;
  cursor: pointer;
  margin-top: 32px;
  transition: border-color 0.15s, color 0.15s;
}

button.ghost:hover {
  border-color: var(--black);
  color: var(--black);
}

@media (max-width: 768px) {
  .page { padding: 36px 16px 80px; }
  h1 { font-size: 24px; }
  .input-row { flex-direction: column; border: none; gap: 8px; }
  input[type="url"] { border: 1.5px solid var(--black); padding: 13px 14px; }
  button.primary { width: 100%; padding: 13px; text-align: center; }
  .score-num { font-size: 48px; }
  .stat-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .ext-links { flex-direction: column; }
  .ext-a { text-align: center; padding: 8px 12px; }
  .check-row { grid-template-columns: 1fr 52px; gap: 8px; }
  .c-icon { display: none; }
  .sec-head { padding: 14px 0; }
}
</style>
</head>
<body>
<div class="page">
  <header>
    <div class="brand">Aladin Dev Center · Synergy Team</div>
    <h1>SEO 자동 검수</h1>
    <p class="desc">URL을 입력하면 테크니컬 SEO 체크리스트 기준으로 자동 평가합니다</p>
  </header>

  <div class="input-wrap" id="inputWrap">
    <label class="field-label">검수할 페이지 URL</label>
    <div class="input-row">
      <input type="url" id="urlInput" placeholder="https://www.aladin.co.kr/mybookshop/curator.aspx?id=6" />
      <button class="primary" id="runBtn" onclick="runCheck()">검수 시작</button>
    </div>
    <p class="input-note">※ 외부 공개 URL만 가능 · JS 렌더링 후 콘텐츠 / CWV 실측치는 별도 도구 안내</p>
  </div>

  <div class="loading" id="loading">
    <div class="loading-inner">
      <div class="spinner"></div>
      <div class="loading-msg" id="loadingMsg">페이지를 분석하는 중입니다... (15~30초 소요)</div>
    </div>
  </div>

  <div class="report" id="report"></div>
</div>

<script>
const SECTIONS = [
  { id:'meta', title:'HTML · 메타 구조', keys:['title_exists','title_unique','title_length','desc_exists','desc_length','h1_count','heading_structure','lang','charset','viewport','og_tags'] },
  { id:'crawl', title:'크롤링 · 색인', keys:['canonical','noindex','robots_meta'] },
  { id:'content', title:'콘텐츠 접근성', keys:['js_hidden_content','visibility_hidden','anchor_text','img_alt','semantic_tags'] },
  { id:'schema', title:'구조화 데이터', keys:['schema_exists','schema_type','breadcrumb'] },
  { id:'url', title:'URL 구조', keys:['url_slug','https'] },
  { id:'perf', title:'성능 · CWV', keys:['cwv_note','lazy_load','img_dimensions'] }
];

const LABELS = {
  title_exists:'title 태그 존재', title_unique:'title 고유값 (브랜드명 반복 여부)', title_length:'title 길이 (30~60자 권장)',
  desc_exists:'meta description 존재', desc_length:'meta description 길이 (80~160자 권장)',
  h1_count:'H1 개수 (정확히 1개)', heading_structure:'헤딩 계층 구조 (H1→H2→H3)',
  lang:'html lang="ko" 설정', charset:'meta charset utf-8', viewport:'meta viewport 설정', og_tags:'OG 태그 적용',
  canonical:'canonical 태그', noindex:'noindex 사용 여부', robots_meta:'robots meta 이상 없음',
  js_hidden_content:'JS에만 의존하는 주요 콘텐츠', visibility_hidden:'body visibility:hidden 초기값',
  anchor_text:'앵커 텍스트 품질 (무의미한 반복)', img_alt:'이미지 alt 텍스트', semantic_tags:'시맨틱 태그 사용',
  schema_exists:'JSON-LD 구조화 데이터 존재', schema_type:'적절한 Schema @type', breadcrumb:'BreadcrumbList 구현',
  url_slug:'URL 가독성 (파라미터 vs 슬러그)', https:'HTTPS 적용',
  cwv_note:'Core Web Vitals (외부 도구 확인 필요)', lazy_load:'이미지 lazy-load 적용', img_dimensions:'이미지 width/height 속성 (CLS 방지)'
};

async function runCheck() {
  const url = document.getElementById('urlInput').value.trim();
  if (!url.startsWith('http')) { alert('올바른 URL을 입력해주세요.'); return; }
  document.getElementById('runBtn').disabled = true;
  document.getElementById('loading').style.display = 'block';
  document.getElementById('report').style.display = 'none';
  document.getElementById('report').innerHTML = '';

  try {
    const res = await fetch('/api/check', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url })
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    renderReport(url, data.result);
  } catch(e) {
    document.getElementById('report').innerHTML = `<div class="err-box">오류: ${e.message}</div>`;
    document.getElementById('report').style.display = 'block';
  }

  document.getElementById('loading').style.display = 'none';
  document.getElementById('runBtn').disabled = false;
}

function renderReport(url, res) {
  let pass=0, warn=0, fail=0, skip=0;
  Object.values(res).forEach(r => {
    if(r.status==='pass') pass++;
    else if(r.status==='warn') warn++;
    else if(r.status==='fail') fail++;
    else skip++;
  });
  const checkable = pass + warn + fail;
  const score = checkable > 0 ? Math.round(pass / checkable * 100) : 0;
  const scoreClass = score >= 80 ? 'score-pass' : score >= 60 ? 'score-mid' : 'score-bad';
  const enc = encodeURIComponent(url);

  let html = `<div class="report-summary">
    <div class="report-url">${url}</div>
    <div class="score-block">
      <div class="score-num ${scoreClass}">${score}</div>
      <div class="score-denom">/ 100</div>
    </div>
    <div class="stat-row">
      <div class="stat-item"><div class="stat-dot dot-pass"></div><span class="stat-label">통과</span><span class="stat-num">&nbsp;${pass}</span></div>
      <div class="stat-item"><div class="stat-dot dot-warn"></div><span class="stat-label">주의</span><span class="stat-num">&nbsp;${warn}</span></div>
      <div class="stat-item"><div class="stat-dot dot-fail"></div><span class="stat-label">실패</span><span class="stat-num">&nbsp;${fail}</span></div>
      <div class="stat-item"><div class="stat-dot dot-skip"></div><span class="stat-label">확인불가</span><span class="stat-num">&nbsp;${skip}</span></div>
    </div>
    <div class="ext-links">
      <a class="ext-a" href="https://pagespeed.web.dev/analysis?url=${enc}" target="_blank">PageSpeed Insights →</a>
      <a class="ext-a" href="https://search.google.com/test/rich-results?url=${enc}" target="_blank">Rich Results Test →</a>
      <a class="ext-a" href="https://search.google.com/search-console" target="_blank">Search Console →</a>
    </div>
  </div>
  <div class="sections">`;

  SECTIONS.forEach(sec => {
    const rows = sec.keys.map(k => {
      const r = res[k]; if (!r) return '';
      const icons = { pass:'✓', warn:'!', fail:'✕', skip:'—' };
      const ic = { pass:'icon-pass', warn:'icon-warn', fail:'icon-fail', skip:'icon-skip' };
      const sc = { pass:'s-pass', warn:'s-warn', fail:'s-fail', skip:'s-skip' };
      const lb = { pass:'통과', warn:'주의', fail:'실패', skip:'—' };
      const dc = r.status==='fail'?'fail':r.status==='warn'?'warn':r.status==='pass'?'pass':'';
      return `<div class="check-row">
        <div class="c-icon ${ic[r.status]||'icon-skip'}">${icons[r.status]||'—'}</div>
        <div>
          <div class="c-name">${LABELS[k]||k}</div>
          ${r.detail?`<div class="c-detail ${dc}">${r.detail}</div>`:''}
        </div>
        <div class="c-status ${sc[r.status]||'s-skip'}">${lb[r.status]||'—'}</div>
      </div>`;
    }).join('');

    const sfail = sec.keys.filter(k => res[k]?.status==='fail').length;
    const swarn = sec.keys.filter(k => res[k]?.status==='warn').length;
    const sbadge = sfail > 0
      ? `<span class="sec-badge badge-fail">실패 ${sfail}</span>`
      : swarn > 0
      ? `<span class="sec-badge badge-warn">주의 ${swarn}</span>`
      : `<span class="sec-badge badge-pass">이상없음</span>`;

    html += `<div class="section" id="s-${sec.id}">
      <div class="sec-head" onclick="toggle('${sec.id}')">
        <div class="sec-left">
          <div class="sec-title">${sec.title}</div>
          ${sbadge}
        </div>
        <div class="sec-arrow">▼</div>
      </div>
      <div class="sec-body">${rows}</div>
    </div>`;
  });

  html += `</div><button class="ghost" onclick="reset()">← 다른 URL 검수하기</button>`;
  const box = document.getElementById('report');
  box.innerHTML = html;
  box.style.display = 'block';
}

function toggle(id) { document.getElementById('s-'+id).classList.toggle('collapsed'); }
function reset() {
  document.getElementById('report').style.display = 'none';
  document.getElementById('urlInput').value = '';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
document.getElementById('urlInput').addEventListener('keydown', e => { if(e.key==='Enter') runCheck(); });
</script>
</body>
</html>
